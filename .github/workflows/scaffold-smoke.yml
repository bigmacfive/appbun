name: Scaffold Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install
      - run: bun run build
      - run: node ./bin/appbun.js https://example.com --name Example --out-dir ./tmp/example --quiet
      - run: test -f ./tmp/example/electrobun.config.ts
      - run: test -f ./tmp/example/appbun.generated.json
      - run: test -f ./tmp/example/package.json
      - run: test -f ./tmp/example/src/mainview/index.ts
      - run: test -f ./tmp/example/scripts/create-dmg.mjs
      - run: grep -q APPLE_SIGN_IDENTITY ./tmp/example/scripts/create-dmg.mjs
      - run: grep -q appbun.generated.json ./tmp/example/README.md
