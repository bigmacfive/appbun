name: Build desktop app (on demand)

# Two front doors:
#   1. A "Build a desktop app" issue form (the public path for non-developers). A maintainer
#      applies the `build-request` label to authorize the build (prevents burning expensive
#      macOS minutes on spam).
#   2. workflow_dispatch with inputs (the power-user path).
#
# The result is an UNSIGNED macOS .dmg attached to a prerelease and linked back in the issue.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL (https://...)"
        required: true
      name:
        description: "App name"
        required: true
      titlebar:
        description: "Titlebar style"
        required: false
        default: system
        type: choice
        options: [system, unified, compact, minimal]
      theme_color:
        description: "Theme color hex (e.g. #2563eb). Blank = auto-detect."
        required: false
      width:
        description: "Window width (320-4000)"
        required: false
      height:
        description: "Window height (320-4000)"
        required: false

permissions:
  contents: write
  issues: write

# One build at a time per issue / per manual run; do not cancel an in-flight build.
concurrency:
  group: build-app-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    # Issue events only proceed when the `build-request` label is the one just applied.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.label.name == 'build-request') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Parse + validate inputs from either the issue form body or workflow_dispatch inputs.
      # Values are exposed as step outputs and consumed later strictly via `env:` (never
      # interpolated into a `run:` script) so a malicious app name cannot inject shell.
      - id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const isDispatch = context.eventName === 'workflow_dispatch';
            let fields = {};
            if (isDispatch) {
              const i = context.payload.inputs || {};
              fields = {
                url: i.url, name: i.name, titlebar: i.titlebar,
                theme_color: i.theme_color, width: i.width, height: i.height,
              };
            } else {
              // Issue forms render as "### <Label>\n\n<value>" blocks.
              const body = context.payload.issue.body || '';
              const map = {};
              for (const block of body.split(/\r?\n###\s+/)) {
                const nl = block.indexOf('\n');
                if (nl === -1) continue;
                const label = block.slice(0, nl).trim().toLowerCase();
                let value = block.slice(nl + 1).trim();
                if (value === '_No response_' || value === '_No response') value = '';
                map[label] = value;
              }
              fields = {
                url: map['app url'],
                name: map['app name'],
                titlebar: map['titlebar style'],
                theme_color: map['theme color (optional)'],
                width: map['window width (optional)'],
                height: map['window height (optional)'],
              };
            }

            const errors = [];
            const url = (fields.url || '').trim();
            if (!/^https?:\/\/\S+$/i.test(url)) errors.push('URL must start with http:// or https://');

            const name = (fields.name || '').replace(/[\r\n]+/g, ' ').trim().slice(0, 60);
            if (!name) errors.push('App name is required');

            const titlebars = ['system', 'unified', 'compact', 'minimal'];
            let titlebar = (fields.titlebar || 'system').trim();
            if (!titlebars.includes(titlebar)) titlebar = 'system';

            let theme = (fields.theme_color || '').trim();
            if (theme && !/^#?[0-9a-fA-F]{6}$/.test(theme)) {
              errors.push('Theme color must be a 6-digit hex like #2563eb');
              theme = '';
            } else if (theme && !theme.startsWith('#')) {
              theme = '#' + theme;
            }

            const intOrEmpty = (raw, label) => {
              const v = (raw || '').trim();
              if (!v) return '';
              const n = Number(v);
              if (!Number.isInteger(n) || n < 320 || n > 4000) {
                errors.push(`${label} must be an integer between 320 and 4000`);
                return '';
              }
              return String(n);
            };
            const width = intOrEmpty(fields.width, 'Window width');
            const height = intOrEmpty(fields.height, 'Window height');

            core.setOutput('valid', errors.length === 0 ? 'true' : 'false');
            core.setOutput('reason', errors.join('; '));
            core.setOutput('url', url);
            core.setOutput('name', name);
            core.setOutput('titlebar', titlebar);
            core.setOutput('theme', theme);
            core.setOutput('width', width);
            core.setOutput('height', height);
            core.setOutput('issue', context.payload.issue ? String(context.payload.issue.number) : '');

      - name: Reject invalid input
        if: steps.parse.outputs.valid != 'true'
        env:
          ISSUE: ${{ steps.parse.outputs.issue }}
          REASON: ${{ steps.parse.outputs.reason }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "⚠️ Could not start the build: $REASON"$'\n\n'"Edit the issue and re-apply the \`build-request\` label to retry."
          fi
          echo "::error::Invalid input: $REASON"
          exit 1

      - uses: oven-sh/setup-bun@v2
        if: steps.parse.outputs.valid == 'true'
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        if: steps.parse.outputs.valid == 'true'
        with:
          node-version: 22

      - name: Build DMG
        if: steps.parse.outputs.valid == 'true'
        env:
          URL: ${{ steps.parse.outputs.url }}
          NAME: ${{ steps.parse.outputs.name }}
          TITLEBAR: ${{ steps.parse.outputs.titlebar }}
          THEME: ${{ steps.parse.outputs.theme }}
          WIDTH: ${{ steps.parse.outputs.width }}
          HEIGHT: ${{ steps.parse.outputs.height }}
        run: |
          set -euo pipefail
          args=( "$URL" --name "$NAME" --titlebar "$TITLEBAR" --out-dir ./_build --yes --quiet )
          [ -n "$THEME" ]  && args+=( --theme-color "$THEME" )
          [ -n "$WIDTH" ]  && args+=( --width "$WIDTH" )
          [ -n "$HEIGHT" ] && args+=( --height "$HEIGHT" )
          npx -y appbun@latest create "${args[@]}"
          npx -y appbun@latest package --cwd ./_build --dmg
          DMG=$(ls _build/build/dmg/*.dmg | head -n1)
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Publish & link
        if: steps.parse.outputs.valid == 'true'
        env:
          ISSUE: ${{ steps.parse.outputs.issue }}
          NAME: ${{ steps.parse.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="ondemand-${ISSUE:-$GITHUB_RUN_ID}-$SHORT_SHA"
          gh release create "$TAG" --prerelease --title "$NAME (on-demand build)" \
            --notes "Unsigned macOS build generated by appbun. On first launch: System Settings → Privacy & Security → Open Anyway." \
            "$DMG_PATH" 2>/dev/null || gh release upload "$TAG" "$DMG_PATH" --clobber
          DL=$(gh release view "$TAG" --json assets -q '.assets[0].url')
          echo "Download: $DL"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "✅ Your **$NAME** desktop app is ready: [Download .dmg]($DL)"$'\n\n'"⚠️ It is unsigned. On first launch macOS may block it — open **System Settings → Privacy & Security → Open Anyway**."
            gh issue close "$ISSUE" 2>/dev/null || true
          fi
